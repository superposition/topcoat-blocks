[workspace]
resolver = "3"
members = ["crates/topcoat-blocks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/superposition/topcoat-blocks"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

